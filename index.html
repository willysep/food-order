<!DOCTYPE html>
<html lang="id">

  <title>Food Order - Pemesanan Makanan Katering</title>
  <meta name="description" content="Aplikasi pemesanan makanan katering minimalis berbasis web statis">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-top-row">

          <span>KateringApp</span>
